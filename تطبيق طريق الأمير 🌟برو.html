<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--card:#0f0f0f;--border:#1a1a1a;--text:#fff;--muted:#888;--gold:#fbbf24;--gold2:#d97706}
body.light{--bg:#f5f5f5;--card:#fff;--border:#e5e5e5;--text:#111;--muted:#666}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none;transition:.3s}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.98);backdrop-filter:blur(20px);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;min-height:56px}
body.light .header{background:rgba(245,245,245,.98)}
.h-left{display:flex;align-items:center;gap:10px}
.h-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:18px;box-shadow:0 0 20px rgba(251,191,36,.3);animation:glow 3s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px #fbbf24)}50%{filter:drop-shadow(0 0 16px #fbbf24)}}
.h-title{font-size:20px;font-weight:800;background:linear-gradient(180deg,#fde68a,var(--gold) 50%,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.h-right{display:flex;gap:8px}
.h-btn{width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--muted);transition:.15s}
.h-btn:active{transform:scale(.92)}
.xp-bar{position:fixed;top:56px;left:0;right:0;height:3px;background:#111;z-index:60}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--gold),#f59e0b);width:15%;transition:width .5s;box-shadow:0 0 10px rgba(251,191,36,.5)}
.daily-counter{position:fixed;top:66px;right:12px;background:rgba(0,0,0,.95);backdrop-filter:blur(12px);padding:6px 12px;border-radius:16px;font-size:11px;color:var(--gold);border:1px solid #2a1f00;z-index:50;font-weight:700}
body.light .daily-counter{background:rgba(255,255,255,.95)}
.counter{position:fixed;top:66px;left:12px;background:rgba(0,0,0,.95);backdrop-filter:blur(12px);padding:6px 12px;border-radius:16px;font-size:11px;color:var(--muted);border:1px solid var(--border);z-index:50}
body.light .counter,body.light .daily-counter{background:rgba(255,255,255,.95)}
.counter b{color:var(--gold);font-weight:800}
.content{padding:76px 12px 90px}
.tab{display:none}.tab.active{display:block;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.filters{display:flex;gap:6px;padding:10px 0;overflow-x:auto;scrollbar-width:none;margin:0 -4px 10px}
.filters::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:18px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer;flex-shrink:0;font-weight:600;transition:.15s}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:800;box-shadow:0 0 16px rgba(251,191,36,.3)}
.card{background:linear-gradient(180deg,var(--card),#0a0a0a);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.5)}
body.light .card{background:linear-gradient(180deg,#fff,#fafafa);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.learn-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px}
.cn-char{font-size:42px;font-weight:800;background:linear-gradient(180deg,#fff 0%,#fde68a 30%,var(--gold) 70%,var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.cn-py{font-size:13px;color:var(--muted);margin-top:6px;font-family:ui-monospace}
.play-btn{width:52px;height:52px;background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:1.5px solid #2a2a2a;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s}
.play-btn:active{transform:scale(.92)}
.play-btn svg{width:20px;height:20px;fill:#aaa}
.play-btn.playing{background:linear-gradient(135deg,var(--gold),#f59e0b);border-color:var(--gold)}
.play-btn.playing svg{fill:#000}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.lang-box{background:#000;border:1px solid var(--border);border-radius:14px;padding:13px 10px;text-align:center}
body.light .lang-box{background:#fff}
.lang-label{font-size:9px;color:var(--muted);margin-bottom:8px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.lang-ar{font-size:18px;font-weight:800}
.lang-box.en .lang-ar{color:#7dd3fc}
.lang-box.cn .lang-ar{color:#fcd34d}
.lang-en{font-size:10.5px;color:#555;margin-top:4px;font-family:ui-monospace}
.result-box{background:linear-gradient(180deg,rgba(5,25,15,.9),rgba(2,12,7,.95));border:1.5px solid rgba(16,185,129,.2);border-radius:16px;padding:16px;text-align:center}
body.light .result-box{background:linear-gradient(180deg,rgba(240,253,244,.9),rgba(220,252,231,.95))}
.result-ar{font-size:24px;font-weight:800;color:var(--text);margin-bottom:4px}
.result-meta{font-size:11px;color:#10b981;direction:ltr;font-family:ui-monospace;font-weight:600}
.actions{display:flex;gap:8px;margin-top:14px}
.action{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:13px;border:1.5px solid #222;background:var(--card);color:var(--muted);flex:1;transition:.15s}
.action:active{transform:scale(.96)}
.action-heart{flex:none;width:44px;font-size:18px}
.action-heart.liked{color:#ef4444;background:#1f0a0a;border-color:#3a1515}
.action-video{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#000;border:none;font-weight:800;flex:1.6;box-shadow:0 3px 12px rgba(251,191,36,.25)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(0,0,0,.98);backdrop-filter:blur(24px);border-top:1px solid #151515;display:flex;padding:8px 0 22px;z-index:200}
body.light .nav{background:rgba(245,245,245,.98)}
.nav-item{flex:1;text-align:center;color:#444;font-size:10px;cursor:pointer;padding:6px 2px;font-weight:600}
.nav-item.active{color:var(--gold)}
.nav-ic{font-size:22px;display:block;margin-bottom:3px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;border:1.5px solid #2a2a2a;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:3000;max-width:85%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.factory-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;transition:.2s}
.factory-card:active{transform:scale(.98)}
.ship-input{width:100%;background:#000;border:1px solid #222;color:#fff;padding:12px;border-radius:10px;font-size:14px;margin-bottom:10px;outline:none}
body.light .ship-input{background:#fff;color:#111;border-color:#ddd}
.ship-input:focus{border-color:var(--gold)}
.ship-btn{width:100%;background:linear-gradient(135deg,var(--gold),#f59e0b);color:#000;border:none;padding:13px;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer}
</style>
</head>

let currentFilter='all',favs=new Set();

function t(ar,en){return lang==='ar'?ar:en}
function showToast(m){const toast=document.getElementById('toast');toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000)}
function switchTab(tab,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+tab).classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));el.classList.add('active')}
function setFilter(el,f){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');currentFilter=f;render()}
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(el=>{el.textContent=el.getAttribute(lang==='ar'?'data-ar':'data-en')});render();renderFactories();showToast(lang==='ar'?'تم التحويل للعربية':'Switched to English')}
function toggleTheme(){document.body.classList.toggle('light');localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');showToast(document.body.classList.contains('light')?'☀️ '+t('وضع نهاري','Light'):'🌙 '+t('وضع ليلي','Dark'))}
function render(){const c=document.getElementById('learn-container');const f=currentFilter==='all'?words:words.filter(w=>w[5]===currentFilter);document.getElementById('counter').textContent=f.length;c.innerHTML=f.map(w=>`<div class="card"><div class="learn-top"><div><div class="cn-char">${w[0]}</div><div class="cn-py">${w[1]}</div></div><div class="play-btn" onclick="play('${w[0]}',this)"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div></div><div class="lang-grid"><div class="lang-box en"><div class="lang-label">🇺🇸 ENGLISH</div><div class="lang-ar">${w[3]}</div><div class="lang-en">${w[1]}</div></div><div class="lang-box cn"><div class="lang-label">🇨🇳 中文</div><div class="lang-ar">${w[2]}</div><div class="lang-en">${w[1]}</div></div></div><div class="result-box"><div class="result-ar">${lang==='ar'?w[4]:w[3]}</div><div class="result-meta">${w[3]} • ${w[0]}</div></div><div class="actions"><div class="action action-heart ${favs.has(w[0])?'liked':''}" onclick="fav('${w[0]}',this)">${favs.has(w[0])?'❤️':'🤍'}</div><div class="action action-video" onclick="record('${w[0]}')">📹 ${t('سجل','Record')}</div><div class="action" onclick="voice('${w[0]}')">🎤 ${t('تدرب','Practice')}</div></div></div>`).join('')}
function play(text,btn){const audio=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-CN&client=tw-ob&q='+encodeURIComponent(text));btn.classList.add('playing');audio.play().catch(()=>{});audio.onended=()=>btn.classList.remove('playing');if(navigator.vibrate)navigator.vibrate(10)}
function fav(term,el){if(favs.has(term)){favs.delete(term);el.classList.remove('liked');el.innerHTML='🤍'}else{favs.add(term);el.classList.add('liked');el.innerHTML='❤️';showToast('❤️ '+t('تمت الإضافة','Added'))}}
function record(term){showToast('📹 '+t('تسجيل','Recording')+': '+term);if(navigator.vibrate)navigator.vibrate(20)}
function voice(term){showToast('🎤 '+t('تدرب على','Practice')+': '+term)}
function renderFactories(){const list=document.getElementById('factories-list');list.innerHTML=factories.map(f=>`<div class="factory-card" onclick="openFactory(${f.id})"><div style="display:flex;gap:12px;align-items:start"><div style="width:48px;height:48px;background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0">🏭</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap"><div style="font-weight:800;font-size:15px">${f.n}</div><div style="background:var(--gold);color:#000;padding:2px 6px;border-radius:5px;font-size:9px;font-weight:800">✓</div></div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">${f.cn} • ${f.l}</div><div style="font-size:13px;color:var(--text);margin-bottom:8px">${f.s}</div><div style="display:flex;gap:12px;font-size:11px;color:var(--muted);flex-wrap:wrap"><span>⭐ ${f.r}</span><span>📦 ${f.p.toLocaleString()}</span><span>🏢 ${f.y}</span><span>📋 MOQ:${f.m}</span></div></div></div><div style="display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)"><button onclick="event.stopPropagation();window.open('https://wa.me/${f.w}','_blank')" style="flex:1;background:#25D366;color:#fff;border:none;padding:8px;border-radius:8px;font-size:12px;font-weight:600">💬 WhatsApp</button><button onclick="event.stopPropagation();location.href='mailto:${f.e}'" style="flex:1;background:var(--card);color:var(--muted);border:1px solid var(--border);padding:8px;border-radius:8px;font-size:12px">✉️ Email</button></div></div>`).join('')}
function openFactory(id){const f=factories.find(x=>x.id===id);showToast('🏭 '+f.n+' • '+f.cn);if(navigator.vibrate)navigator.vibrate(15)}
function calcShip(){const w=parseFloat(document.getElementById('weight').value)||100;const v=parseFloat(document.getElementById('value').value)||2500;const cost=Math.round(w*4.5+v*0.03+120);document.getElementById('shipCost').textContent='$'+cost;document.getElementById('shipTime').textContent=t('بحري • 18-22 يوم','Sea • 18-22 days');document.getElementById('shipResult').style.display='block';showToast('✅ '+t('تم الحساب','Calculated'))}
function trackShip(){const num=document.getElementById('trackNum').value||'JIALU2026001';const result=document.getElementById('trackResult');result.style.display='block';result.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">'+t('جاري البحث...','Searching...')+'</div>';setTimeout(()=>{result.innerHTML=`<div style="background:#000;border:1px solid var(--border);border-radius:12px;padding:16px"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><div><div style="font-weight:700;color:var(--gold)">${num}</div><div style="font-size:11px;color:var(--muted)">JIALU POWER • 10kWh × 5</div></div><div style="text-align:left"><div style="font-size:20px;font-weight:800;color:#22c55e">65%</div></div></div><div style="height:4px;background:#111;border-radius:2px;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:65%;background:linear-gradient(90deg,var(--gold),#22c55e)"></div></div><div style="font-size:12px;color:var(--muted)">📍 ${t('في الطريق - البحر الأحمر','In transit - Red Sea')}</div></div>`;showToast('✅ '+t('تم العثور','Found'))},1200)}
