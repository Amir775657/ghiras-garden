@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@700&display=swap');
:root{--bg:#08080A;--bg-e:#0F0F12;--bg-e2:#15151A;--card:#131316;--border:#1E1E22;--border-s:#2A2A30;--text:#FFF;--text-2:#A1A1AA;--text-3:#71717B;--gold:#FFD700;--gold2:#D4AF37;--gold-bg:rgba(255,215,0,0.08);--gold-bd:rgba(255,215,0,0.18);--success-bg:rgba(34,197,94,0.08);--danger:#EF4444;--danger-bg:rgba(239,68,68,0.08);--r-xl:20px;--r-pill:100px;}
[data-theme="light"]{--bg:#F6F6F8;--bg-e:#FFF;--bg-e2:#F1F1F3;--card:#FFF;--border:#E4E4E7;--border-s:#D4D4D8;--text:#18181B;--text-2:#71717B;--text-3:#A1A1AA;--gold:#D97706;--gold-bg:rgba(217,119,6,0.08);--gold-bd:rgba(217,119,6,0.18);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);position:relative}
.header{position:sticky;top:0;z-index:100;background:rgba(8,8,10,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
[data-theme="light"] .header{background:rgba(246,246,248,0.92)}
.h-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.h-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:18px;flex-shrink:0}
.h-title{font-size:15px;font-weight:800;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .h-sub{font-size:10px;color:var(--text-2);margin-top:2px;font-weight:600}
.h-right{display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;background:var(--bg-e);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font-size:13px;font-weight:800;transition:.2s;user-select:none}
.icon-btn:active{transform:scale(.96)}
.xp-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;height:2px;background:var(--border);z-index:101}
.xp-fill{height:100%;background:var(--gold);width:0%;transition:width .4s ease}
.level-ring{width:36px;height:36px;position:relative;flex-shrink:0}
.level-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.level-ring-bg{fill:none;stroke:var(--border);stroke-width:3}
.level-ring-fill{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .4s ease}
.level-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.content{padding:0 16px 110px}
.tab{display:none}.tab.active{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.search-wrap{position:relative;margin:14px 0 12px}
.search-input{width:100%;background:var(--bg-e);border:1px solid var(--border);border-radius:14px;padding:13px 44px 13px 16px;font-size:14px;color:var(--text);outline:none;transition:.2s}
.search-input:focus{border-color:var(--gold-bd);box-shadow:0 0 0 3px var(--gold-bg)}
.search-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-3);width:18px;height:18px;pointer-events:none}
.search-clear{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:26px;height:26px;background:var(--border);border-radius:8px;display:none;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);font-weight:800}
.search-clear.show{display:flex}
[dir="ltr"] .search-icon{right:auto;left:14px}
[dir="ltr"] .search-input{padding:13px 16px 13px 44px}
[dir="ltr"] .search-clear{left:auto;right:12px}
.filters-wrap{position:sticky;top:64px;z-index:50;background:rgba(8,8,10,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin:0 -16px;padding:10px 16px 12px;border-bottom:1px solid transparent}
[data-theme="light"] .filters-wrap{background:rgba(246,246,248,0.9)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-pill);font-size:12px;color:var(--text-2);white-space:nowrap;cursor:pointer;font-weight:600;transition:.18s;user-select:none;flex-shrink:0}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.active.gold{background:var(--gold);border-color:var(--gold);color:#000}
.counter{display:inline-flex;background:var(--bg-e);border:1px solid var(--border);padding:5px 10px;border-radius:var(--r-pill);font-size:11px;color:var(--text-3);margin-right:8px}
.counter b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-xl);padding:18px;margin-bottom:12px;contain:content;transition:.2s}
[data-theme="light"] .card{box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.learn-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px}
.cn-char{font-size:28px;font-weight:700;font-family:'Noto Sans SC','Tajawal',sans-serif;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
[data-theme="light"] .cn-char{background:none;-webkit-text-fill-color:var(--text);color:var(--text)}
.cn-py{display:inline-flex;margin-top:6px;font-size:11px;color:var(--gold);font-family:'Inter',monospace;background:var(--bg-e);border:1px solid var(--border);padding:3px 7px;border-radius:8px;direction:ltr}
.play-btn{width:42px;height:42px;background:var(--bg-e);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.2s}
.play-btn.playing{background:var(--gold);border-color:var(--gold);animation:pulseGold 1s infinite}
@keyframes pulseGold{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,.3)}50%{box-shadow:0 0 0 8px rgba(255,215,0,0)}}
.play-btn svg{width:15px;height:15px;fill:var(--text-2);transition:.2s}
.play-btn.playing svg{fill:#000}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.lang-box{background:var(--bg-e);border:1px solid var(--border);border-radius:12px;padding:11px 10px;text-align:center}
.lang-label{font-size:9px;color:var(--text-3);margin-bottom:6px;font-weight:700;letter-spacing:.04em}
.lang-ar{font-size:13px;font-weight:700;line-height:1.3}
.lang-en{font-size:10px;color:var(--text-3);margin-top:3px;font-family:'Inter',monospace;direction:ltr;line-height:1.3}
.result-box{background:var(--success-bg);border:1px solid rgba(34,197,94,.12);border-radius:12px;padding:12px;text-align:center}
.result-ar{font-size:19px;font-weight:800}
.result-meta{font-size:10px;color:var(--text-2);margin-top:2px;font-family:'Inter',monospace;direction:ltr}
.actions{display:flex;gap:8px;margin-top:12px}
.action{height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;font-size:12px;border:1px solid var(--border);background:var(--bg-e);color:var(--text-2);transition:.18s;user-select:none}
.action:active{transform:scale(.98)}
.action-heart{width:42px;flex:none}
.action-heart.liked{color:var(--danger);background:var(--danger-bg);border-color:rgba(239,68,68,.2)}
.action-video{flex:1.2;background:var(--gold);color:#000;border:none;font-weight:800}
.action-voice{flex:1}
.action.recording{background:var(--danger);color:#fff;border-color:var(--danger)}
.rec-ind{display:none;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;background:var(--danger-bg);border-radius:10px;font-size:11px;color:var(--danger);border:1px solid rgba(239,68,68,.15)}
.rec-ind.active{display:flex}
.rec-dot{width:7px;height:7px;background:var(--danger);border-radius:50%;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.preview{display:none;margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#000}
.preview.active{display:block}
.preview video,.preview audio{width:100%;display:block}
.vc{padding:10px;background:var(--bg-e);display:flex;gap:8px}
.vc-btn{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;border:1px solid var(--border);transition:.2s}
.vc-primary{background:var(--gold);color:#000;border:none}
.vc-secondary{background:var(--bg-e2);color:var(--text)}
.factory{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.18s}
.factory:hover{border-color:var(--border-s);transform:translateY(-1px)}
.f-img{width:52px;height:52px;border-radius:11px;object-fit:cover;flex-shrink:0;background:var(--bg-e)}
.f-name{font-weight:700;font-size:13px}
.f-loc{font-size:11px;color:var(--text-3);margin:3px 0}
.f-stats{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.f-stat{font-size:10px;background:var(--bg-e);padding:3px 7px;border-radius:7px;border:1px solid var(--border);color:var(--text-2)}
.section{font-size:13px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.section::before{content:'';width:3px;height:14px;background:var(--gold);border-radius:10px;flex-shrink:0}
.portal{position:fixed;inset:0;background:var(--bg);z-index:1000;transform:translateY(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);overflow-y:auto;max-width:440px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.portal.active{transform:translateY(0)}
.portal-header{position:sticky;top:0;background:rgba(8,8,10,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;z-index:10}
[data-theme="light"] .portal-header{background:rgba(246,246,248,0.92)}
.portal-back{width:36px;height:36px;background:var(--bg-e);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800}
.portal-content{padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.hero{position:relative;height:190px;border-radius:16px;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
.hero-img{width:100%;height:100%;object-fit:cover}
.hero-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent 60%);display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.hero-stats{display:flex;gap:6px;flex-wrap:wrap}
.hero-stat{background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:5px 9px;border-radius:9px;font-size:10px;color:#fff;border:1px solid rgba(255,255,255,.08)}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.quick-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;transition:.18s}
.quick-btn:active{transform:scale(.97)}
.quick-tx{font-size:10px;color:var(--text-2);margin-top:4px;font-weight:600}
.portal-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.portal-sec-title{font-size:11px;font-weight:800;margin-bottom:10px;opacity:.9}
.learn-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.learn-scroll::-webkit-scrollbar{display:none}
.mini-card{min-width:140px;background:var(--bg-e);border:1px solid var(--border);border-radius:12px;padding:10px;flex-shrink:0}
.pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.pay-card{background:var(--bg-e);border:1px solid var(--border);border-radius:13px;padding:13px;text-align:center;cursor:pointer;position:relative;transition:.18s}
.pay-card.selected{border-color:var(--gold);background:var(--gold-bg);box-shadow:0 0 0 2px var(--gold-bg)}
.pay-badge{position:absolute;top:7px;left:7px;background:var(--gold);color:#000;font-size:8px;font-weight:800;padding:2px 5px;border-radius:20px}
[dir="ltr"] .pay-badge{left:auto;right:7px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(8,8,10,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:200}
[data-theme="light"] .nav{background:rgba(255,255,255,0.92)}
.nav-item{flex:1;text-align:center;color:#6B7280;font-size:10px;cursor:pointer;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;transition:.18s}
.nav-item.active{color:var(--text)}
.nav-item.active .nav-ic{color:var(--gold)}
.nav-ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:#18181B;border:1px solid var(--gold);padding:11px 16px;border-radius:12px;font-size:12px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:3000;max-width:84%;text-align:center;color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.onboard{position:fixed;inset:0;background:var(--bg);z-index:2000;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:28px;text-align:center;transition:opacity .28s, transform .28s}
.onboard.hide{opacity:0;pointer-events:none;transform:scale(.98)}
.onboard-logo{width:72px;height:72px;background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:#000;margin-bottom:16px;box-shadow:0 10px 30px rgba(255,215,0,.25)}
.xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);background:var(--card);border:1px solid var(--border);padding:18px 24px;border-radius:18px;text-align:center;z-index:2500;opacity:0;pointer-events:none;transition:.32s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.xp-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.xp-popup-text{font-size:26px;font-weight:900;color:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:2000;opacity:0;pointer-events:none;transition:opacity .22s;padding:20px;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto}
.modal-bg.active{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin:auto 0;transform:translateY(12px) scale(.98);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.modal-bg.active .modal{transform:translateY(0) scale(1)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:14px;font-weight:800}
.modal-close{width:32px;height:32px;background:var(--bg-e);border:1px solid var(--border);border-radius:99px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sos-item{background:var(--bg-e);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.18s}
.sos-item:active{transform:scale(.99)}
.sos-ar{font-size:14px;font-weight:700}
.sos-py{font-size:11px;color:var(--text-3);font-family:'Inter',monospace;direction:ltr;margin-top:2px}
.ai-fab{position:fixed;bottom:88px;left:16px;width:48px;height:48px;background:var(--gold);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:150;color:#000;font-weight:900;box-shadow:0 8px 20px rgba(255,215,0,.28);transition:.2s}
.ai-fab:active{transform:scale(.95)}
[dir="ltr"] .ai-fab{left:auto;right:16px}
.ai-chat{position:fixed;bottom:150px;left:14px;right:14px;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:160;display:none;overflow:hidden;max-height:65vh;flex-direction:column}
[dir="ltr"] .ai-chat{left:auto;right:14px}
.ai-chat.active{display:flex;animation:fade .2s ease}
.ai-chat-header{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg-e)}
.ai-chat-body{padding:14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.ai-msg{background:var(--bg-e);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.6;max-width:85%;word-break:break-word}
.ai-msg.user{align-self:flex-end;background:var(--gold-bg);border-color:var(--gold-bd)}
.input-field{width:100%;background:var(--bg-e);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:11px;font-size:13px;outline:none;transition:.18s}
.input-field:focus{border-color:var(--gold-bd);box-shadow:0 0 0 3px var(--gold-bg)}
.select-field{width:100%;background:var(--bg-e);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:11px;font-size:13px;outline:none;transition:.18s}
.select-field:focus{border-color:var(--gold-bd)}
.btn-primary{width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;border:none;padding:12px;border-radius:11px;font-weight:900;font-size:13px;cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(255,215,0,.18)}
.btn-primary:active{transform:scale(.99)}
.empty{text-align:center;padding:36px 20px;color:var(--text-3)}
.lang-switch{display:inline-flex;background:var(--bg-e);border:1px solid var(--border);border-radius:9px;padding:2px}
.lang-opt{padding:5px 9px;border-radius:7px;font-size:11px;font-weight:800;cursor:pointer;color:var(--text-3);min-width:34px;text-align:center;transition:.18s}
.lang-opt.active{background:var(--text);color:var(--bg)}
.challenge-box{background:var(--card);border:1px dashed var(--gold);border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.choice-container{display:flex;gap:8px;margin:12px 0}
.choice-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:10px 8px;border-radius:12px;cursor:pointer;font-weight:800;font-family:'Tajawal';flex:1;font-size:11px;line-height:1.3;transition:.2s}
[data-theme="light"] .choice-btn{color:var(--text);background:var(--bg-e);border-color:var(--border)}
.choice-btn.selected{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.upload-form{display:none;margin-top:12px;text-align:right}
.upload-form.show{display:block;animation:fade .2s ease}
.form-group{margin-bottom:10px;text-align:right}
.form-group label{font-size:10px;color:var(--text-2);margin-bottom:4px;display:block;font-weight:700}
.form-group input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-e);color:var(--text);font-family:'Tajawal';text-align:right;font-size:12px;outline:none}
[dir="ltr"] .form-group{ text-align:left }
[dir="ltr"] .form-group input{ text-align:left }
