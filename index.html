:root {
  color-scheme: light only;
  --ghiras-green: #1A4D2E;
  --ghiras-gold: #D4AF37;
  --ghiras-gold-deep: #C9A227;
  --ghiras-gold-soft: rgba(212, 175, 55, 0.14);
  --ghiras-green-soft: #F2EEDD;
  --ghiras-bg: linear-gradient(180deg, #FFFBF2 0%, #F7F9F1 48%, #F0F7F0 100%);
  --ghiras-card: rgba(255, 255, 255, 0.72);
  --ghiras-radius: 28px;
  --ghiras-ink: #3A3A3A;
  --ghiras-muted: #6F6A5E;
  --ghiras-line: rgba(212, 175, 55, 0.35);
  --ghiras-sand: rgba(212, 175, 55, 0.10);
}

html {
  color-scheme: light only;
  background: #FFFBF2;
}

@media (prefers-color-scheme: dark) {
  :root, html, body {
    color-scheme: light only;
    background: #FFFBF2 !important;
  }

  * {
    color-scheme: light only;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--ghiras-bg);
  background-attachment: fixed;
  color: var(--ghiras-ink);
  font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.85;
  letter-spacing: 0.01em;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 340px;
  pointer-events: none;
  background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(212, 175, 55, 0.10), rgba(212, 175, 55, 0) 70%);
  z-index: 0;
}

button {
  font-family: inherit;
  position: relative;
  transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
}

/* لمعة زجاجية خفيفة من الأعلى للأزرار — تحويل وشفافية فقط، بلا إعادة تخطيط. */

button:not(.btn-complete)::after {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 50%;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0));
  pointer-events: none;
}

button:focus-visible {
  outline: 3px solid var(--ghiras-gold);
  outline-offset: 3px;
}

button:active {
  transform: scale(0.99);
}

.card-scroll::-webkit-scrollbar {
  width: 5px;
}

.card-scroll::-webkit-scrollbar-thumb {
  background: rgba(212, 175, 55, 0.45);
  border-radius: 99px;
}

/* ——— بطاقات زجاجية ذهبية هادئة ——— */

.bg-\[var\(--ghiras-card\)\] {
  background-color: rgba(255, 255, 255, 0.72) !important;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-color: rgba(212, 175, 55, 0.20) !important;
  border-width: 1px !important;
  border-radius: 28px !important;
  box-shadow: 0 14px 30px rgba(26, 77, 46, 0.04), 0 3px 10px rgba(212, 175, 55, 0.03);
  transition: box-shadow 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
}

/* قفل اللون الفاتح — لا توجد نسخة داكنة للبطاقات. */

/* بطاقة التعلم — زجاجية مع خط ذهبي رفيع في الأعلى */

.learning-glass {
  position: relative;
  background: rgba(255, 255, 255, 0.72) !important;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(212, 175, 55, 0.35) !important;
  border-radius: 28px !important;
  box-shadow: 0 18px 36px rgba(26, 77, 46, 0.05), 0 4px 12px rgba(212, 175, 55, 0.04);
  will-change: transform, opacity;
  transition: box-shadow 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
}

.learning-glass::before {
  content: "";
  position: absolute;
  top: 0;
  left: 36px;
  right: 36px;
  height: 1px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.65), transparent);
  pointer-events: none;
  z-index: 2;
}

/* خط لمعة علوي رفيع أبيض شفاف في أعلى البطاقة الرئيسية. */

.learning-glass::after {
  content: "";
  position: absolute;
  top: 1px;
  left: 36px;
  right: 36px;
  height: 1px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
  pointer-events: none;
  z-index: 2;
}

/* قفل اللون الفاتح — لا توجد نسخة داكنة لبطاقة التعلم. */

/* رسالة تشجيع هادئة — تظهر بنعومة ولا تقفز */

.gentle-note {
  animation: gentleFade 0.9s ease both;
  letter-spacing: 0.01em;
}

@keyframes gentleFade {
  from {
    opacity: 0;
    transform: translateY(4px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* زر أكمل — تدرج ذهبي هادئ */

.btn-complete {
  background: linear-gradient(135deg, #D4AF37 0%, #B8962E 100%) !important;
  color: #fff !important;
  border: 1px solid rgba(212, 175, 55, 0.45);
  border-radius: 999px !important;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 10px 22px rgba(212, 175, 55, 0.22), 0 2px 6px rgba(26, 77, 46, 0.07);
  transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
}

.btn-complete:active {
  transform: scale(1.01);
}

.btn-complete:disabled {
  transform: none;
}

/* ——— احتفال ذهبي هادئ ——— */

.gold-flash {
  animation: goldFlash 1.1s ease-out;
}

@keyframes goldFlash {
  0% {
    box-shadow: 0 0 0 rgba(212, 175, 55, 0);
  }

  30% {
    box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.22), 0 0 22px rgba(212, 175, 55, 0.20);
  }

  100% {
    box-shadow: 0 18px 36px rgba(26, 77, 46, 0.05), 0 4px 12px rgba(212, 175, 55, 0.04);
  }
}

.gold-particle {
  position: absolute;
  left: 50%;
  top: 42%;
  border-radius: 999px;
  background: radial-gradient(circle, #F6E27A 0%, #D4AF37 70%);
  pointer-events: none;
  opacity: 0;
  animation: goldFly var(--burst-duration, 0.8s) ease-out forwards;
  animation-delay: var(--burst-delay, 0s);
}

@keyframes goldFly {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.6);
  }

  18% {
    opacity: 0.9;
  }

  100% {
    opacity: 0;
    transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.05);
  }
}

.capsule-toast {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  max-width: calc(100% - 32px);
  text-align: center;
  line-height: 1.5;
  padding: 10px 20px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(212, 175, 55, 0.38);
  box-shadow: 0 10px 26px rgba(212, 175, 55, 0.16);
  color: #1A4D2E;
  font-size: 14px;
  font-weight: 900;
  animation: capsuleToast 3s ease-out forwards;
}

@keyframes capsuleToast {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(-6px);
  }

  10% {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  82% {
    opacity: 1;
  }

  100% {
    opacity: 0;
    transform: translateX(-50%) translateY(-4px);
  }
}

.cert-glow {
  animation: certGlow 3s ease-out;
}

@keyframes certGlow {
  0%, 100% {
    box-shadow: 0 18px 36px rgba(26, 77, 46, 0.05), 0 4px 12px rgba(212, 175, 55, 0.04);
  }

  25% {
    box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.28), 0 0 28px rgba(212, 175, 55, 0.22);
  }

  60% {
    box-shadow: 0 0 0 1px rgba(212, 175, 55, 0.16), 0 0 18px rgba(212, 175, 55, 0.13);
  }
}

@media (prefers-reduced-motion: reduce) {
  .gold-flash, .gold-particle, .capsule-toast, .cert-glow, .gentle-note {
    animation-duration: 0.01s;
  }

  .btn-complete, button {
    transition: none;
  }
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

.disabled\:opacity-60:disabled {
  opacity: 0.6;
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:justify-between {
    justify-content: space-between;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-7 {
    padding-left: 1.75rem;
    padding-right: 1.75rem;
  }

  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:pt-12 {
    padding-top: 3rem;
  }
}
