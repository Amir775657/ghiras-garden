// Expand to 36 each
function expandTo36(base, id){
  let out=[];
  for(let i=0;i<36;i++){
    let w = base[i % base.length];
    out.push({...w, id:`${id}-${i+1}`, en: i<base.length ? w.en : `${w.en} ${i+1}`});
  }
  return out;
}

const IDENTITY_SEEDS = {
  'fruit-1': "من مأرب بدأت أول حضارة تسقي الأرض، ومن حلمك يبدأ مستقبل يثمر وطنك. جذورنا سبأ ومستقبلنا أنت.",

function App(){
  const [selected, setSelected] = useState(null);
  const [planted, setPlanted] = useState(()=>{try{return new Set(JSON.parse(localStorage.getItem('giras_planted')||'[]'))}catch{return new Set()}});
  const [completed, setCompleted] = useState(()=>{try{return JSON.parse(localStorage.getItem('giras_completed')||'{}')}catch{return {}}});
  const [name, setName] = useState(()=> localStorage.getItem('giras_name')||'');
  const [nameInput, setNameInput] = useState('');
  const [stage, setStage] = useState('plant'); // plant, story, quiz, success
  const [storyIdx, setStoryIdx] = useState(0);
  const [storyMode, setStoryMode] = useState('arabic'); // english, arabic, both -> default arabic as requested
  const [quizIdx, setQuizIdx] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [score, setScore] = useState(0);
  const [showSettings, setShowSettings] = useState(false);
  const [slowIdx, setSlowIdx] = useState(-1);
  const [xp, setXp] = useState(0);

  const field = useMemo(()=> FIELDS.find(f=>f.id===selected), [selected]);
  const words = useMemo(()=> selected ? ALL_WORDS[selected] : [], [selected]);
  const completedForField = useMemo(()=> new Set(completed[selected]||[]), [completed, selected]);
  const storyNumber = useMemo(()=> Math.min(completedForField.size,5), [completedForField]);
  const currentWords = useMemo(()=> words.slice(storyNumber*6, storyNumber*6+6), [words, storyNumber]);

  useEffect(()=>{
    localStorage.setItem('giras_planted', JSON.stringify([...planted]));
  }, [planted]);
  useEffect(()=>{
    localStorage.setItem('giras_completed', JSON.stringify(completed));
  }, [completed]);
  useEffect(()=>{
    if(name) localStorage.setItem('giras_name', name);
  }, [name]);
  useEffect(()=>{
    const totalPlanted = planted.size;
    const totalCompleted = Object.values(completed).reduce((a,b)=>a+(b?.length||0),0);
    setXp(totalPlanted*10 + totalCompleted*50);
  }, [planted, completed]);

  const speak = (t, rate=0.9)=>{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=rate;
    speechSynthesis.speak(u);
  };

  const speakSlow = (text)=>{
    if(!window.speechSynthesis) return;
    const wordsArr = text.split(' ');
    let i=0;
    setSlowIdx(0);
    const next = ()=>{
      if(i>=wordsArr.length){ setSlowIdx(-1); return; }
      setSlowIdx(i);
      const u = new SpeechSynthesisUtterance(wordsArr[i]);
      u.lang='en-US'; u.rate=0.6;
      u.onend = ()=>{ i++; setTimeout(next, 400); };
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    };
    next();
  };

  const generateStory = (isArabic=false)=>{
    if(!field || currentWords.length<6) return '';
    const templates = isArabic ? FF_AR_PRON[field.id] : FF_EN[field.id];
    let tpl = templates[storyIdx % templates.length];
    const n = name || 'أحمد';
    const w = currentWords;
    const map = {
      '{name}': isArabic ? n : n,
      '{w1}': isArabic ? w[0].pron : w[0].en,
      '{w2}': isArabic ? w[1].pron : w[1].en,
      '{w3}': isArabic ? w[2].pron : w[2].en,
      '{w4}': isArabic ? w[3].pron : w[3].en,
      '{w5}': isArabic ? w[4].pron : w[4].en,
      '{w6}': isArabic ? w[5].pron : w[5].en,
    };
    Object.entries(map).forEach(([k,v])=>{ tpl = tpl.replaceAll(k,v); });
    return tpl;
  };

  const storyEn = useMemo(()=> generateStory(false), [field, currentWords, storyIdx, name]);
  const storyAr = useMemo(()=> generateStory(true), [field, currentWords, storyIdx, name]);

  const plantWord = (id)=>{
    const s = new Set(planted); s.add(id); setPlanted(s);
  };
  const allPlanted = currentWords.length>0 && currentWords.every(w=>planted.has(w.id));

  const quizQuestions = useMemo(()=>{
    if(currentWords.length<6) return [];
    return currentWords.map((w,i)=>{
      const type = i%3;
      const opts = [w.en, ...ALL_WORDS[field.id].filter(x=>x.id!==w.id).sort(()=>0.5-Math.random()).slice(0,3).map(x=>x.en)].sort(()=>0.5-Math.random());
      return {
        qAr: type===0? w.ar : type===1? w.phAr : w.seAr,
        qPron: type===0? w.pron : type===1? w.phPr : w.sePr,
        correct: w.en,
        opts
      };
    });
  }, [currentWords, field]);

  const handleQuizAnswer = (opt)=>{
    const correct = opt===quizQuestions[quizIdx].correct;
    const newAns = [...answers, {q:quizIdx, correct}];
    setAnswers(newAns);
    if(newAns.length===6){
      const sc = newAns.filter(a=>a.correct).length;
      setScore(sc);
      if(sc>=4){
        const comp = {...completed};
        if(!comp[selected]) comp[selected]=[];
        if(!comp[selected].includes(storyNumber)) comp[selected].push(storyNumber);
        setCompleted(comp);
        setStage('success');
        // confetti
        for(let i=0;i<30;i++){
          const d=document.createElement('div'); d.className='confetti';
          d.style.left=Math.random()*100+'vw'; d.style.background=`hsl(${Math.random()*60+30},100%,50%)`;
          d.style.animationDuration=(Math.random()*2+2)+'s'; d.style.animationDelay=Math.random()*0.5+'s';
          document.body.appendChild(d); setTimeout(()=>d.remove(),4000);
        }
      } else {
        setStage('story');
        setQuizIdx(0); setAnswers([]);
      }
    } else {
      setQuizIdx(quizIdx+1);
    }
  };

  const growthEmoji = (plantedPct, compCount)=>{
    if(compCount>=6) return '🍎';
    if(compCount>=4) return '🌳';
    if(compCount>=2) return '🌿';
    if(plantedPct>0.5) return '🌱';
    return '🌰';
  };

  // PWA install
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [showInstall, setShowInstall] = useState(false);
  useEffect(()=>{
    window.addEventListener('beforeinstallprompt', e=>{e.preventDefault(); setDeferredPrompt(e); setShowInstall(true);});
    // manifest blob
    const manifest = {
      name:"غِراس - اغرس ذاتك ليثمر وطنك",
      short_name:"غِراس",
      start_url:".",
      display:"standalone",
      background_color:"#FFFBF0",
      theme_color:"#f59e0b",
      icons:[{src:"https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/1f33f.png", sizes:"192x192", type:"image/png"}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link'); link.rel='manifest'; link.href=url; document.head.appendChild(link);
    // SW
    if('serviceWorker' in navigator){
      const swCode = `self.addEventListener('install', e=>{e.waitUntil(caches.open('giras-v3').then(c=>c.addAll(['./'])))}); self.addEventListener('fetch', e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)).catch(()=>caches.match('./')))});`;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(()=>{});
    }
  }, []);

  return (
    <div className="min-h-screen">
      {/* Header */}
      <header className="sticky top-0 z-40 glass border-b">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-white font-black text-xl">غ</div>
            <div>
              <div className="font-black text-[18px] leading-none">غِراس</div>
              <div className="text-[11px] text-gray-500">اغرس ذاتك ليثمر وطنك</div>
            </div>
            <span className="hidden md:inline-flex text-[10px] px-2 py-1 rounded-full bg-amber-100 border border-amber-200">حديقة الغرس</span>
          </div>
          <div className="flex items-center gap-2">
            <div className="hidden md:flex items-center gap-2 text-[12px]">
              <span className="px-2 py-1 rounded-full bg-white border">🔥 3 أيام</span>
              <span className="px-2 py-1 rounded-full bg-white border">{planted.size}/180 مزروع</span>
              <span className="px-2 py-1 rounded-full bg-amber-400 text-white font-bold">⭐ {xp} XP</span>
            </div>
            {showInstall && (
              <button onClick={()=>{deferredPrompt?.prompt(); setShowInstall(false);}} className="text-[12px] px-3 py-1.5 rounded-full bg-black text-white">ثبت التطبيق 📲</button>
            )}
            <button onClick={()=>setShowSettings(true)} className="w-8 h-8 rounded-full bg-white border flex items-center justify-center">⚙️</button>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {!name && (
          <div className="glass card-shadow rounded-[24px] p-5 mb-6 pop">
            <div className="text-[16px] font-bold mb-2">أهلاً بك في حديقتك 🌱</div>
            <div className="text-[13px] text-gray-600 mb-3">اسمك لتصبح القصة باسمك - سيحفظ في جهازك ويعمل بدون نت</div>
            <div className="flex gap-2">
              <input value={nameInput} onChange={e=>setNameInput(e.target.value)} placeholder="مثلاً: أمير من المكلا" className="flex-1 px-4 py-2.5 rounded-full border bg-white text-[14px] outline-none focus:border-amber-400"/>
              <button onClick={()=>{if(nameInput.trim()){setName(nameInput.trim()); setNameInput('');}}} className="px-5 py-2.5 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 text-white font-bold text-[14px]">ازرع اسمي 🌿</button>
            </div>
          </div>
        )}

        {/* Stats mobile */}
        <div className="md:hidden flex gap-2 mb-4 text-[11px]">
          <span className="flex-1 text-center py-2 rounded-full bg-white border">🔥 3 أيام</span>
          <span className="flex-1 text-center py-2 rounded-full bg-white border">{planted.size}/180</span>
          <span className="flex-1 text-center py-2 rounded-full bg-amber-400 text-white font-bold">⭐ {xp}</span>
        </div>

        {/* Fields grid */}
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {FIELDS.map(f=>{
            const wordsF = ALL_WORDS[f.id];
            const plantedInField = wordsF.filter(w=>planted.has(w.id)).length;
            const pct = plantedInField / 36;
            const compCount = (completed[f.id]||[]).length;
            return (
              <div key={f.id} onClick={()=>{setSelected(f.id); setStage('plant'); setStoryIdx(compCount%6); setQuizIdx(0); setAnswers([]);}} className={`glass card-shadow rounded-[24px] p-4 cursor-pointer hover:scale-[1.01] transition ${f.border}`}>
                <div className="flex justify-between items-start mb-3">
                  <div className="flex items-center gap-3">
                    <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${f.grad} flex items-center justify-center text-xl floatY`}>{f.icon}</div>
                    <div>
                      <div className="font-bold text-[15px]">{f.name}</div>
                      <div className="text-[11px] text-gray-500">{f.sub}</div>
                    </div>
                  </div>
                  <div className="text-[20px]">{growthEmoji(pct, compCount)}</div>
                </div>
                <div className="flex gap-2 text-[10px] mb-3">
                  <span className="px-2 py-1 rounded-full bg-white border">{compCount}/6 قصص</span>
                  <span className="px-2 py-1 rounded-full bg-white border">{plantedInField}/36 كلمة</span>
                </div>
                <div className="w-full h-2 rounded-full bg-gray-100 overflow-hidden mb-3">
                  <div className={`h-full bg-gradient-to-r ${f.grad} transition-all`} style={{width:`${pct*100}%`}}></div>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {wordsF.slice(0,4).map(w=>(
                    <span key={w.id} className={`text-[10px] px-2 py-1 rounded-full border ${planted.has(w.id)?'bg-amber-100 border-amber-300':'bg-white'}`}>{w.en}</span>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        <div className="mt-6 glass rounded-[20px] p-4 text-[12px] text-gray-600 leading-relaxed">
          <b>💡 كيف تتعلم؟</b> اختر حقل → ازرع 6 كلمات → اقرأ القصة بوضع <b>النطق العربي</b> الجديد (بدون ترجمة) → اسقها بالاختبار → احصد الثمرة. كل القصص محفوظة وتعمل بدون إنترنت.
        </div>
      </main>

      {/* Modal */}
      {selected && field && (
        <div className="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/30 backdrop-blur-sm p-0 md:p-6">
          <div className="w-full md:max-w-3xl max-h-[92vh] md:max-h-[88vh] bg-[#FFFBF0] rounded-t-[28px] md:rounded-[28px] overflow-hidden flex flex-col pop card-shadow border">
            <div className={`h-2 w-full bg-gradient-to-r ${field.grad}`}></div>
            <div className="p-4 md:p-5 flex items-center justify-between border-b bg-white">
              <div className="flex items-center gap-3">
                <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${field.grad} flex items-center justify-center`}>{field.icon}</div>
                <div>
                  <div className="font-bold text-[15px]">{field.name} - القصة {storyNumber+1}</div>
                  <div className="text-[11px] text-gray-500">{currentWords.length} كلمات • {completedForField.size}/6 مكتمل</div>
                </div>
              </div>
              <button onClick={()=>setSelected(null)} className="w-8 h-8 rounded-full bg-gray-100">✕</button>
            </div>

            <div className="overflow-y-auto p-4 md:p-5 space-y-4 scrollbar-hide">
              {stage==='plant' && (
                <>
                  <div className="flex gap-2 text-[11px]">
                    <span className="px-3 py-1.5 rounded-full bg-white border">🌱 زرع</span>
                    <span className="px-3 py-1.5 rounded-full bg-gray-100 text-gray-400">📖 قصة</span>
                    <span className="px-3 py-1.5 rounded-full bg-gray-100 text-gray-400">💧 سقي</span>
                  </div>
                  <div className="grid gap-3">
                    {currentWords.map(w=>(
                      <div key={w.id} className="glass rounded-[18px] p-3 border">
                        <div className="flex justify-between items-start">
                          <div>
                            <div className="font-bold text-[15px] flex items-center gap-2">{w.en} <button onClick={()=>speak(w.en)} className="text-[12px] w-6 h-6 rounded-full bg-white border">🔊</button></div>
                            <div className="text-[12px] text-gray-600">{w.ar} • <span className="text-amber-700">{w.pron}</span></div>
                          </div>
                          <button onClick={()=>plantWord(w.id)} className={`text-[11px] px-3 py-1 rounded-full border ${planted.has(w.id)?'bg-emerald-500 text-white border-emerald-500':'bg-white'}`}>{planted.has(w.id)?'✓ مزروعة':'ازرع'}</button>
                        </div>
                        <div className="mt-2 grid grid-cols-1 gap-1 text-[11px]">
                          <div className="p-2 rounded-xl bg-white/70">📝 <b>{w.phEn}</b> - {w.phAr} <span className="text-amber-700">({w.phPr})</span> <button onClick={()=>speak(w.phEn)} className="mr-1">🔈</button></div>
                          <div className="p-2 rounded-xl bg-white/70">💬 {w.seEn} - {w.seAr} <span className="text-amber-700">({w.sePr})</span> <button onClick={()=>speak(w.seEn)} className="mr-1">🔈</button></div>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button disabled={!allPlanted} onClick={()=>setStage('story')} className={`w-full py-3 rounded-full font-bold text-[14px] ${allPlanted?'bg-black text-white':'bg-gray-200 text-gray-400'}`}>اقرأ القصة بالنطق العربي 📖</button>
                </>
              )}

              {stage==='story' && (
                <>
                  <div className="flex gap-2 text-[11px]">
                    <span className="px-3 py-1.5 rounded-full bg-emerald-100 border border-emerald-200">✓ زرع</span>
                    <span className="px-3 py-1.5 rounded-full bg-white border">📖 قصة</span>
                    <span className="px-3 py-1.5 rounded-full bg-gray-100 text-gray-400">💧 سقي</span>
                  </div>

                  {/* Identity seed for fruit */}
                  {field.id==='fruit' && (
                    <div className="rounded-[16px] bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 p-3 text-[12px] leading-relaxed">
                      <div className="font-bold mb-1">🏛️ بذرة هوية</div>
                      <div>{IDENTITY_SEEDS[`fruit-${storyNumber+1}`]||''}</div>
                    </div>
                  )}

                  {/* Mode toggle - NEW FEATURE */}
                  <div className="flex p-1 rounded-full bg-gray-100 border text-[12px] font-bold">
                    <button onClick={()=>setStoryMode('english')} className={`flex-1 py-2 rounded-full ${storyMode==='english'?'bg-white shadow':''}`}>🇺🇸 إنجليزي</button>
                    <button onClick={()=>setStoryMode('arabic')} className={`flex-1 py-2 rounded-full ${storyMode==='arabic'?'bg-amber-400 text-white shadow':''}`}>📝 نطق عربي</button>
                    <button onClick={()=>setStoryMode('both')} className={`flex-1 py-2 rounded-full ${storyMode==='both'?'bg-white shadow':''}`}>👁️ الاثنين</button>
                  </div>

                  {storyMode==='english' && (
                    <div className="rounded-[18px] bg-white border p-4">
                      <div className="text-[13px] text-gray-500 mb-2">النص الأصلي - اضغط الكلمة لتسمعها</div>
                      <div className="text-[16px] leading-8">
                        {storyEn.split(' ').map((t,i)=>{
                          const isPlantedWord = currentWords.some(w=> t.toLowerCase().includes(w.en.toLowerCase()) || w.pron===t);
                          return <span key={i} onClick={()=>speak(t)} className={`inline-block m-1 px-2 py-0.5 rounded-full cursor-pointer ${isPlantedWord?'bg-amber-100 border border-amber-300':''}`}>{t} </span>;
                        })}
                      </div>
                      <div className="mt-3 flex gap-2">
                        <button onClick={()=>speak(storyEn)} className="text-[12px] px-3 py-1.5 rounded-full bg-black text-white">🔊 اسمع القصة</button>
                        <button onClick={()=>{setStoryIdx((storyIdx+1)%6)}} className="text-[12px] px-3 py-1.5 rounded-full bg-white border">🔄 قصة أخرى</button>
                      </div>
                    </div>
                  )}

                  {storyMode==='arabic' && (
                    <div className="rounded-[20px] border-2 border-amber-300 bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50 p-5">
                      <div className="text-center mb-3">
                        <div className="font-black text-[16px]">اقرأها كما تُنطق 👇</div>
                        <div className="text-[11px] text-amber-800 bg-white/70 inline-block px-3 py-1 rounded-full border border-amber-200 mt-1">مكتوبة بحروف عربية بدون ترجمة - ركز على النطق فقط</div>
                      </div>
                      <div className="text-[22px] leading-[2.2] font-bold text-[#1e293b] text-center rtl-word">
                        {storyAr.split(' ').map((t,i)=>{
                          return <span key={i} onClick={()=>{const eng = storyEn.split(' ')[i]||t; speak(eng);}} className={`inline-block mx-1 px-2 py-1 rounded-xl cursor-pointer hover:bg-white border border-transparent hover:border-amber-300 ${slowIdx===i?'bg-amber-400 text-white':''}`}>{t} </span>;
                        })}
                      </div>
                      <div className="mt-4 flex flex-wrap gap-2 justify-center">
                        <button onClick={()=>speak(storyEn)} className="text-[12px] px-4 py-2 rounded-full bg-black text-white">🔊 اسمع الإنجليزي</button>
                        <button onClick={()=>speakSlow(storyEn)} className="text-[12px] px-4 py-2 rounded-full bg-white border">🐢 تدريب بطيء</button>
                        <button onClick={()=>{navigator.clipboard?.writeText(`قصة ${field.name} - نطق عربي:\n${storyAr}\n\nالأصل إنجليزي:\n${storyEn}\n\nغِراس 🌱`); alert('تم النسخ!')}} className="text-[12px] px-4 py-2 rounded-full bg-white border">📋 نسخ</button>
                      </div>
                      <div className="mt-3 text-[10px] text-center text-amber-800">اضغط أي كلمة عربية لتسمع نطقها الإنجليزي</div>
                    </div>
                  )}

                  {storyMode==='both' && (
                    <>
                      <div className="rounded-[18px] bg-white border p-4">
                        <div className="text-[11px] text-gray-500 mb-2">🇺🇸 English</div>
                        <div className="text-[15px] leading-7">{storyEn}</div>
                      </div>
                      <div className="rounded-[18px] border-2 border-dashed border-amber-300 bg-amber-50 p-4">
                        <div className="text-[11px] text-amber-800 mb-2">📝 النطق بحروف عربية (بدون ترجمة)</div>
                        <div className="text-[18px] leading-8 font-bold">{storyAr}</div>
                      </div>
                    </>
                  )}

                  <button onClick={()=>{setQuizIdx(0); setAnswers([]); setStage('quiz');}} className="w-full py-3 rounded-full bg-black text-white font-bold text-[14px]">اسقِ حديقتك - اختبار 💧</button>
                </>
              )}

              {stage==='quiz' && (
                <>
                  <div className="text-[12px] text-gray-600">سؤال {quizIdx+1} من 6</div>
                  <div className="rounded-[18px] bg-white border p-4">
                    <div className="font-bold text-[16px] mb-1">{quizQuestions[quizIdx]?.qAr}</div>
                    <div className="text-[12px] text-amber-700">{quizQuestions[quizIdx]?.qPron}</div>
                  </div>
                  <div className="grid gap-2">
                    {quizQuestions[quizIdx]?.opts.map((o,i)=>(
                      <button key={i} onClick={()=>handleQuizAnswer(o)} className="w-full text-left p-3 rounded-xl bg-white border hover:border-amber-400 text-[14px]">{o}</button>
                    ))}
                  </div>
                </>
              )}

              {stage==='success' && (
                <div className="text-center py-8">
                  <div className="text-[60px] floatY">🍎</div>
                  <div className="font-black text-[20px] mt-2">نمت نبتتك! +50 XP</div>
                  <div className="text-[13px] text-gray-600 mt-1">أحرزت {score}/6 - {name}، استمرارك يصنع الأستاذ ✨</div>
                  <button onClick={()=>setSelected(null)} className="mt-6 px-6 py-3 rounded-full bg-black text-white font-bold">العودة للحديقة 🌱</button>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {showSettings && (
        <div className="fixed inset-0 z-[60] bg-black/30 flex items-center justify-center p-4">
          <div className="bg-white rounded-[24px] p-5 w-full max-w-sm">
            <div className="font-bold text-[16px] mb-3">الإعدادات ⚙️</div>
            <div className="text-[12px] mb-2">الاسم: {name||'غير محدد'}</div>
            <input value={nameInput} onChange={e=>setNameInput(e.target.value)} placeholder="تغيير الاسم" className="w-full px-3 py-2 rounded-full border text-[13px] mb-3"/>
            <button onClick={()=>{if(nameInput){setName(nameInput); setNameInput('');}}} className="w-full py-2 rounded-full bg-black text-white text-[13px] mb-2">حفظ الاسم</button>
            <div className="text-[11px] text-gray-500 mb-3">مزروع: {planted.size} • XP: {xp} • قصص: {Object.values(completed).flat().length}</div>
            <button onClick={()=>{if(confirm('هل تريد مسح كل التقدم؟')){localStorage.clear(); location.reload();}}} className="w-full py-2 rounded-full bg-red-50 border border-red-200 text-red-600 text-[13px]">مسح التقدم 🗑️</button>
            <button onClick={()=>setShowSettings(false)} className="w-full mt-2 py-2 rounded-full bg-gray-100 text-[13px]">إغلاق</button>
          </div>
        </div>
      )}

      <footer className="text-center text-[11px] text-gray-400 py-8">© غِراس 2026 - اغرس ذاتك ليثمر وطنك 🌱 • يعمل بدون إنترنت • حضرموت، المكلا</footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
